# ==============================================================================
# Backend CI Pipeline - Build, Test, and Quality Checks
# ==============================================================================
# This workflow runs on every push and pull request to ensure code quality
# and builds are functioning correctly for the Spring Boot backend
#
# Triggers:
#   - Push to any branch (main, develop, feature/*, etc.)
#   - Pull requests to main and develop
#   - Manual trigger (workflow_dispatch)
# ==============================================================================

name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'backend/**'
      - '.github/workflows/01-ci-backend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug output'
        required: false
        default: false

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: ['17']
    
    services:
      mysql:
        image: mysql:8.0-oracle
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gearup_test
          MYSQL_USER: gearup_user
          MYSQL_PASSWORD: gearup_pass
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Display Java version
        run: java -version

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            mysql -h 127.0.0.1 -u root -proot -e "SELECT 1" && break
            echo "Waiting for MySQL..."
            sleep 1
          done

      - name: Build with Maven
        run: |
          cd backend
          mvn clean verify -B -DskipTests=false \
            -Dspring.datasource.url=jdbc:mysql://localhost:3306/gearup_test \
            -Dspring.datasource.username=gearup_user \
            -Dspring.datasource.password=gearup_pass

      - name: Run tests with coverage
        run: |
          cd backend
          mvn test -B \
            -Dspring.datasource.url=jdbc:mysql://localhost:3306/gearup_test \
            -Dspring.datasource.username=gearup_user \
            -Dspring.datasource.password=gearup_pass \
            -Djacoco.skip=false

      - name: Generate test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Backend Test Results
          path: 'backend/target/surefire-reports/*.xml'
          reporter: 'java-junit'
          fail-on-error: true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v3
        with:
          files: ./backend/target/site/jacoco/jacoco.xml
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false

      - name: Check for security vulnerabilities
        run: |
          cd backend
          mvn org.owasp:dependency-check-maven:check -B -DskipProvidedScope=true || true

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: backend-build-artifacts
          path: backend/target/
          retention-days: 5

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResultsPath = './backend/target/surefire-reports/TEST-*.xml';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '✅ Backend build and tests completed. Check the workflow for details.'
            });

  code-quality:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run SonarQube analysis
        run: |
          cd backend
          mvn clean verify sonar:sonar \
            -Dsonar.projectKey=GearUp-Backend \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -DskipTests=true || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


