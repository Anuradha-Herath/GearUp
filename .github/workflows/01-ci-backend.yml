# ==============================================================================
# Backend CI Pipeline - Build, Test, and Quality Checks
# ==============================================================================
# This workflow runs on every push and pull request to ensure code quality
# and builds are functioning correctly for the Spring Boot backend
#
# Triggers:
#   - Push to any branch (main, develop, feature/*, etc.)
#   - Pull requests to main and develop
#   - Manual trigger (workflow_dispatch)
# ==============================================================================

name: Backend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'backend/**'
      - '.github/workflows/01-ci-backend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Enable debug output'
        required: false
        default: false

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        java-version: ['17']
    
    services:
      mysql:
        image: mysql:8.0-oracle
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gearup_test
          MYSQL_USER: gearup_user
          MYSQL_PASSWORD: gearup_pass
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      - name: Display Java version
        run: java -version

      - name: Wait for MySQL to be ready
        run: |
          for i in {1..30}; do
            mysql -h 127.0.0.1 -u root -proot -e "SELECT 1" && break
            echo "Waiting for MySQL..."
            sleep 1
          done

      - name: Build with Maven
        run: |
          cd backend
          mvn clean verify -B -DskipTests=false \
            -Dspring.datasource.url=jdbc:mysql://localhost:3306/gearup_test \
            -Dspring.datasource.username=gearup_user \
            -Dspring.datasource.password=gearup_pass

      - name: Run tests with coverage
        run: |
          cd backend
          mvn test -B \
            -Dspring.datasource.url=jdbc:mysql://localhost:3306/gearup_test \
            -Dspring.datasource.username=gearup_user \
            -Dspring.datasource.password=gearup_pass \
            -Djacoco.skip=false








