# ==============================================================================
# Frontend CI Pipeline - Build, Test, and Lint
# ==============================================================================
# This workflow runs on every push and pull request to ensure code quality
# and builds are functioning correctly for the React frontend
#
# Triggers:
#   - Push to any branch (main, develop, feature/*, etc.)
#   - Pull requests to main and develop
#   - Manual trigger (workflow_dispatch)
# ==============================================================================

name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
    paths:
      - 'frontend/**'
      - '.github/workflows/02-ci-frontend.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'frontend/**'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Display Node version
        run: node --version && npm --version

      - name: Install dependencies
        run: |
          cd frontend
          npm ci --prefer-offline --no-audit

      - name: Run linter
        run: |
          cd frontend
          npm run lint || true

      - name: Build frontend
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'http://localhost:8080' }}

      - name: Check build output
        run: |
          ls -la frontend/dist/
          du -sh frontend/dist/


