# ==============================================================================
# Deploy to Production Environment
# ==============================================================================
# This workflow deploys the application to production
# with approval requirements and rollback capabilities
#
# Triggers:
#   - Manual trigger (workflow_dispatch) from main branch only
#   - Can be triggered after successful staging deployment
# ==============================================================================

name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version/Tag to deploy'
        required: true
      approval_required:
        description: 'Require approval for deployment'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pre-deployment-checks:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify version tag exists
        run: |
          if git rev-parse "${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "✅ Version tag exists: ${{ github.event.inputs.version }}"
          else
            echo "❌ Version tag does not exist: ${{ github.event.inputs.version }}"
            exit 1
          fi

  approval:
    runs-on: ubuntu-latest
    needs: pre-deployment-checks
    environment:
      name: production
      url: https://gearup.example.com

    steps:
      - name: Approval notification
        run: |
          echo "⏳ Waiting for production deployment approval..."
          echo "Version: ${{ github.event.inputs.version }}"

  deploy-production:
    runs-on: ubuntu-latest
    needs: approval
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          role-session-name: github-actions-deploy
          aws-region: ${{ secrets.AWS_REGION }}
        if: secrets.AWS_ROLE_TO_ASSUME != ''

      - name: Deploy with ECS
        run: |
          echo "Updating ECS services for production..."
          
          # Update backend service
          aws ecs update-service \
            --cluster gearup-production \
            --service gearup-backend \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }} || true
          
          # Update frontend service
          aws ecs update-service \
            --cluster gearup-production \
            --service gearup-frontend \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }} || true
          
          echo "✅ ECS services updated"
        if: secrets.AWS_REGION != ''
        continue-on-error: true

      - name: Deploy with SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PRODUCTION_SERVER_IP }} >> ~/.ssh/known_hosts
          
          echo "Deploying to production..."
          ssh -i ~/.ssh/deploy_key ubuntu@${{ secrets.PRODUCTION_SERVER_IP }} \
            "cd /app && \
             git pull origin main && \
             docker-compose -f docker-compose.yml -f docker-compose.prod.yml pull && \
             docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d"
        if: secrets.PRODUCTION_SERVER_IP != ''
        continue-on-error: true

  health-check:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()

    steps:
      - name: Health check
        run: |
          echo "Performing health checks..."
          
          for i in {1..60}; do
            BACKEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.gearup.example.com/actuator/health)
            FRONTEND_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://gearup.example.com/health)
            
            if [ "$BACKEND_STATUS" = "200" ] && [ "$FRONTEND_STATUS" = "200" ]; then
              echo "✅ All services are healthy"
              exit 0
            fi
            
            echo "Attempt $i/60: Backend=$BACKEND_STATUS, Frontend=$FRONTEND_STATUS"
            sleep 5
          done
          
          echo "❌ Services failed to become healthy"
          exit 1

  smoke-tests:
    runs-on: ubuntu-latest
    needs: health-check
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run smoke tests
        run: |
          echo "Running smoke tests..."
          
          # Test API endpoints
          curl -X GET https://api.gearup.example.com/api/services || exit 1
          curl -X GET https://api.gearup.example.com/api/appointments || exit 1
          
          # Test frontend
          curl -X GET https://gearup.example.com || exit 1
          
          echo "✅ All smoke tests passed"

  post-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-production, smoke-tests]
    if: always()

    steps:
      - name: Determine status
        id: status
        run: |
          if [ "${{ needs.deploy-production.result }}" = "success" ] && [ "${{ needs.smoke-tests.result }}" = "success" ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: production-${{ github.event.inputs.version }}
          release_name: Production Release - ${{ github.event.inputs.version }}
          body: |
            Production deployment completed successfully
            Version: ${{ github.event.inputs.version }}
            Timestamp: ${{ github.event.head_commit.timestamp }}
          draft: false
          prerelease: false
        if: steps.status.outputs.status == 'success'


