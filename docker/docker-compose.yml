# ==============================================================================
# AutoServe Application - Docker Compose Configuration
# ==============================================================================
# This configuration defines the complete stack for the AutoServe application
# including: MySQL Database, Spring Boot Backend, and React Frontend
#
# Usage:
#   Development:  docker-compose up --build
#   Production:   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#   Stop:         docker-compose down
#   Logs:         docker-compose logs -f [service-name]
# ==============================================================================

services:
  # ============================================================================
  # MySQL Database Service
  # ============================================================================
  db:
    image: mysql:8.0-oracle
    container_name: ${COMPOSE_PROJECT_NAME:-autoserve}-db
    restart: unless-stopped
    
    # Security: Use read-only root filesystem where possible
    security_opt:
      - no-new-privileges:true
    
    environment:
      # Database Configuration
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-gearup}
      MYSQL_USER: ${DB_USER:-gearup_user}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      
      # Character Set Configuration
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      MYSQL_INIT_CONNECT: 'SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci'
    
    # Only expose database port internally (not to host)
    expose:
      - "3306"
    
    # Mount volumes for persistence and initialization scripts
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
    
    # MySQL configuration for UTF-8 and connection optimization
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max_connections=200
      --max_allowed_packet=256M
      --innodb_buffer_pool_size=1G
      --innodb_log_file_size=512M
    
    # Health check configuration
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${DB_USER:-gearup_user}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    networks:
      - autoserve-network

  # ============================================================================
  # Spring Boot Backend Service
  # ============================================================================
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    
    image: ${COMPOSE_PROJECT_NAME:-autoserve}/backend:${BACKEND_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-autoserve}-backend
    
    restart: unless-stopped
    
    # Security: Run as non-root user
    security_opt:
      - no-new-privileges:true
    
    # Environment variables
    environment:
      # Spring Configuration
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      
      # Database Configuration
      DATABASE_URL: jdbc:mysql://db:3306/${DB_NAME:-gearup}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&useUnicode=true&autoReconnect=true&failOverReadOnly=false
      DATABASE_USERNAME: ${DB_USER:-gearup_user}
      DATABASE_PASSWORD: ${DB_PASSWORD}
      
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      
      # Email Configuration
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      
      # Frontend URL for email verification links
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      
      # JVM Configuration
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=50.0 -XX:+UseG1GC"
      
      # Logging
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_AUTOSERVE: ${LOGGING_LEVEL_COM_AUTOSERVE:-INFO}
    
    # Expose backend port to host for development (use reverse proxy in production)
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    
    # Wait for database to be healthy
    depends_on:
      db:
        condition: service_healthy
    
    # Health check configuration - Check if port is listening
    healthcheck:
      test: ["CMD-SHELL", "netstat -an | grep 8080 | grep LISTEN || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1.5G
        reservations:
          cpus: '1'
          memory: 768M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=backend"
    
    networks:
      - autoserve-network

  # ============================================================================
  # React Frontend Service (Nginx)
  # ============================================================================
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1
    
    image: ${COMPOSE_PROJECT_NAME:-autoserve}/frontend:${FRONTEND_TAG:-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-autoserve}-frontend
    
    restart: unless-stopped
    
    # Security: Run as non-root user
    security_opt:
      - no-new-privileges:true
    
    # Public-facing port (should be behind reverse proxy in production)
    ports:
      - "${FRONTEND_PORT:-80}:80"
    
    # Wait for backend to be healthy
    depends_on:
      backend:
        condition: service_started
    
    # Environment variables (passed to build context)
    environment:
      - NGINX_HOST=${NGINX_HOST:-localhost}
      - NGINX_PORT=${FRONTEND_PORT:-80}
    
    # Health check configuration
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    
    # Resource limits (frontend is lightweight)
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.5'
          memory: 128M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
        labels: "service=frontend"
    
    networks:
      - autoserve-network

# ==============================================================================
# Named Volumes
# ==============================================================================
volumes:
  mysql_data:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  autoserve-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16