# ==============================================================================
# AutoServe Production Override Configuration
# ==============================================================================
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# This file overrides development settings for production deployments
# ==============================================================================

version: '3.8'

services:
  db:
    restart: always
    
    # Production: Use higher resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    
    # Production: More aggressive health checks
    healthcheck:
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s
    
    # Mount database backup script
    volumes:
      - mysql_data:/var/lib/mysql
      - ../database/migrations:/docker-entrypoint-initdb.d:ro
      - ./backup:/backup:ro
    
    # Production: Stricter logging (using json-file with larger retention)
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "10"
        labels: "service=db,env=production"

  backend:
    restart: always
    
    environment:
      # Production profile
      SPRING_PROFILES_ACTIVE: prod
      
      # Production: Enhanced security
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEYSTORE: "/app/keystore.p12"
      SERVER_SSL_KEYSTORE_PASSWORD: "${SSL_KEYSTORE_PASSWORD}"
      SERVER_SSL_KEYSTORE_TYPE: "PKCS12"
      
      # Gemini API Configuration (for Chatbot)
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      
      # Production: Strict logging
      LOGGING_LEVEL_ROOT: WARN
      LOGGING_LEVEL_COM_AUTOSERVE: INFO
      
      # Production: Performance tuning
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=80.0 -XX:InitialRAMPercentage=60.0 -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefProcEnabled"
    
    # Production: Higher resource allocation
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 3G
        reservations:
          cpus: '2'
          memory: 1.5G
      
      # Restart policy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    
    # Production: Distributed logging
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "10"
        labels: "service=backend,env=production"

  frontend:
    restart: always
    
    # Production: Use standard HTTPS port
    ports:
      - "${FRONTEND_PORT:-443}:443"
      - "80:80"  # Redirect HTTP to HTTPS
    
    # Production: Higher resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '1'
          memory: 256M
      
      # Restart policy
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    
    # Production: SSL certificates and config
    volumes:
      - ./nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    
    # Production: Distributed logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=frontend,env=production"

# ==============================================================================
# Production Volume Configuration
# ==============================================================================
volumes:
  mysql_data:
    driver: local
    driver_opts:
      type: nfs
      o: "addr=${NFS_SERVER},vers=4,soft,timeo=180,bg,tcp,rw"
      device: ":/export/mysql_data"
