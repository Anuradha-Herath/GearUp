---
# Frontend Service
# Exposes the React frontend (Nginx) to external users
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: gearup
  labels:
    app: frontend
    component: web
spec:
  type: NodePort                         # NodePort for external access
  selector:
    app: frontend
  
  # Port configuration
  ports:
  - port: 80                             # Port for accessing service
    targetPort: 80                       # Port on container
    protocol: TCP
    name: http
    nodePort: 30000                      # Fixed port on host (30000-32767)
  
  sessionAffinity: None

---
# Optional: LoadBalancer service type
