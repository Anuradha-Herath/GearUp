---
# Kubernetes Secrets for sensitive data
# IMPORTANT: Base64 encode your actual values before deploying
#
# To generate base64 encoded values in PowerShell:
#   [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("your-value"))
#
# Example: To encode "mysecretpassword":
#   $encoded = [Convert]::ToBase64String([System.Text.Encoding]::UTF8.GetBytes("mysecretpassword"))
#   Write-Host $encoded  # Output: bXlzZWNyZXRwYXNzd29yZA==
#
# NEVER commit actual secret values to git!
# This file should be in .gitignore
#
apiVersion: v1
kind: Secret
metadata:
  name: gearup-secrets
  namespace: gearup
  labels:
    app: gearup
type: Opaque
data:
  # Database Secrets (base64 encoded)
  # Change these to your actual values!
  DB_ROOT_PASSWORD: cm9vdA==                                          # "root"
  DB_USER: Z2VhcnVwX3VzZXI=                                            # "gearup_user"
  DB_PASSWORD: Y2hhbmdlbWVwYXNzd29yZA==                                # "changemypassword"
  
  # JWT Secret (base64 encoded) - MINIMUM 32 characters!
  # Example: "my-super-secret-jwt-key-minimum-32-chars-long-enough"
  JWT_SECRET: bXktc3VwZXItc2VjcmV0LWp3dC1rZXktbWluaW11bS0zMi1jaGFycw==
  
  # External API Keys (base64 encoded)
  # These are for optional features
  GEMINI_API_KEY: Z2VtaW5pLWFwaS1rZXktcGxhY2Vob2xkZXI=              # "gemini-api-key-placeholder"
  SENDGRID_API_KEY: c2VuZGdyaWQtYXBpLWtleS1wbGFjZWhvbGRlcg==        # "sendgrid-api-key-placeholder"
  SENDGRID_FROM_EMAIL: bm9yZXBseUBnZWFydXAuY29t                       # "noreply@gearup.com"

---
# Docker Registry Secret (optional - only needed if pulling from private registry)
# Uncomment if using private Docker images
# apiVersion: v1
# kind: Secret
# metadata:
#   name: dockerhub-secret
#   namespace: gearup
# type: kubernetes.io/dockercfg
# data:
#   .dockercfg: <base64-encoded-docker-config>

---
# Note: To update this secret later, use:
# kubectl create secret generic gearup-secrets \
#   --from-literal=DB_ROOT_PASSWORD=root \
#   --from-literal=DB_USER=gearup_user \
#   --from-literal=DB_PASSWORD=changeme \
#   --from-literal=JWT_SECRET=my-super-secret-jwt-key-min-32-chars \
#   --from-literal=GEMINI_API_KEY=your-key \
#   --from-literal=SENDGRID_API_KEY=your-key \
#   --from-literal=SENDGRID_FROM_EMAIL=noreply@gearup.com \
#   --dry-run=client -o yaml | kubectl apply -f -
