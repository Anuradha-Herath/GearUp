---
# MySQL Database Deployment
# This creates the MySQL pod with proper configuration
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: gearup
  labels:
    app: mysql
    version: "8.0"
spec:
  replicas: 1                           # Single instance for development
  selector:
    matchLabels:
      app: mysql
  strategy:
    type: Recreate                      # Recreate instead of rolling update
  template:
    metadata:
      labels:
        app: mysql
        version: "8.0"
    spec:
      containers:
      - name: mysql
        image: mysql:5.7
        imagePullPolicy: IfNotPresent
        
        # Ports exposed by container
        ports:
        - containerPort: 3306
          name: mysql
          protocol: TCP
        
        # Environment variables from ConfigMap and Secrets
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gearup-secrets
              key: DB_ROOT_PASSWORD
        
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: gearup-config
              key: DB_NAME
        
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: gearup-secrets
              key: DB_USER
        
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gearup-secrets
              key: DB_PASSWORD
        
        - name: MYSQL_CHARACTER_SET_SERVER
          valueFrom:
            configMapKeyRef:
              name: gearup-config
              key: MYSQL_CHARACTER_SET_SERVER
        
        - name: MYSQL_COLLATION_SERVER
          valueFrom:
            configMapKeyRef:
              name: gearup-config
              key: MYSQL_COLLATION_SERVER
        
        - name: MYSQL_INIT_CONNECT
          value: "SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci"
        
        # Volume mounts
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql      # MySQL data directory
        - name: mysql-init
          mountPath: /docker-entrypoint-initdb.d  # Initialization scripts
        
        # Resource requests and limits
        resources:
          requests:
            memory: "512Mi"              # Minimum memory
            cpu: "250m"                  # Minimum CPU (250 millicores)
          limits:
            memory: "1Gi"                # Maximum memory
            cpu: "500m"                  # Maximum CPU
        
        # Liveness probe - restart if not responding
        livenessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - "-h"
            - "127.0.0.1"
          initialDelaySeconds: 30        # Wait 30s before first check
          periodSeconds: 10              # Check every 10s
          timeoutSeconds: 5              # Timeout after 5s
          failureThreshold: 3            # Fail after 3 retries
        
        # Readiness probe - pod ready to receive traffic
        readinessProbe:
          exec:
            command:
            - mysqladmin
            - ping
            - "-h"
            - "127.0.0.1"
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        
        # Security context
        securityContext:
          runAsNonRoot: false            # MySQL image runs as root
          runAsUser: 0                   # Run as root user
          allowPrivilegeEscalation: false # Prevent privilege escalation
          # Don't drop ALL capabilities - MySQL needs some system capabilities
          capabilities:
            drop:
            - NET_RAW
            - ALL
            add:
            - CHOWN
            - DAC_OVERRIDE
            - SETGID
            - SETUID
            - SETFCAP
            - SETPCAP
            - NET_BIND_SERVICE
            - SYS_CHROOT
      
      # Volumes
      volumes:
      - name: mysql-data
        emptyDir: {}                     # Use emptyDir instead of PVC (data lost on pod restart)
      
      - name: mysql-init
        emptyDir: {}                     # Temporary volume for init scripts
      
      # Restart policy
      restartPolicy: Always
      
      # Pod disruption budget (for high availability)
      # terminationGracePeriodSeconds: 30
